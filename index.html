<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Price Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Resets default margins and makes the body fill the entire viewport height */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center; /* Centers horizontally */
            align-items: center;     /* Centers vertically */
            background-color: #fcfcfc; /* Optional: adds a clean background color */
        }

        /* Container for the link and image */
        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 100%;
            padding: 20px; /* Optional: adds a little breathing room on smaller screens */
            box-sizing: border-box;
        }

        /* Makes the image responsive so it doesn't break on mobile screens */
        .image-container img {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <a href="https://babiyalifestyle.com">
            <img src="IMG-20260909-WA0001.jpg" alt="Description of the image">
        </a>
    </div>

</body>
</html>
