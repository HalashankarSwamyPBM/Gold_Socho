<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldSocho</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fcfcfc;
            font-family: 'Outfit', sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .image-text {
            font-size: 1.25rem;
            font-weight: 500;
            color: red;
            text-decoration: none;
            margin-bottom: 10px;
        }

        .image-text span {
            color: green;
        }

        .image-container {
            width: 100%;
            max-width: 500px; /* Limits maximum width of the image wrapper */
            display: flex;
            justify-content: center;
        }

        .image-container img {
            max-width: 80%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3 class="image-text">click the Image to redirect <span>BabiyaLifestyle</span></h3>
        <div class="image-container">
            <a href="https://babiyalifestyle.com">
                <img src="IMG-20260909-WA0001.jpg" alt="Description of the image">
            </a>
        </div>
    </div>

</body>
</html>
